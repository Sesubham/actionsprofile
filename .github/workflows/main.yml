# writing a github workflow for github actions

name: Build WF
on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      
      - name: maven Build
        run: mvn install
  
  Testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: Run Test on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle



