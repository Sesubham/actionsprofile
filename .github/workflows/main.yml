# writing a github workflow for github actions

name: Build WF
on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      
      - name: maven Build
        run: mvn clean install
  
  Testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: Run Test on main branch
        run: mvn clean test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      - name: Show Maven test reports
        if: always()
        run: |
            echo "===== Test Results ====="
            find target/surefire-reports -type f -maxdepth 1 -print
            grep -R -E '<failure|<error|Tests run:' target/surefire-reports || true



